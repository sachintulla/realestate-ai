name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    name: lint + typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [website, dashboard, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @realestate-ai/${{ matrix.app }} lint

      - name: Typecheck
        run: pnpm --filter @realestate-ai/${{ matrix.app }} typecheck
